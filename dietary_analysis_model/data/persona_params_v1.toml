full_day_prob = 0.0
[axis_a.A9]
name = "중복·수정 기록형"
day_rate = [0.90, 0.90]
meal_prob = [0.80, 0.40, 0.20, 0.4]        # 부분 기록일의 끼니별 확률(아침·점심·저녁·간식)
duplicate_rate = 0.10
edit_rate = 0.10
draft_rate = 0.03
[axis_a.A11]
name = "가벼운 시험 사용자"
day_rate = [0.08, 0.08]
