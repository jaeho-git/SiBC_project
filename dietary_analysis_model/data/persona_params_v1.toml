meal_prob = [0.80, 0.40, 0.20, 0.4]        # 부분 기록일의 끼니별 확률(아침·점심·저녁·간식)
gap_start_week_min = 18
gap_start_week_max = 24
gap_weeks_min = 2
gap_weeks_max = 4
[axis_a.A5]
name = "꾸준 → 이탈"
day_rate = [0.95, 0.95]
meal_prob = [0.80, 0.40, 0.20, 0.4]        # 부분 기록일의 끼니별 확률(아침·점심·저녁·간식)
dropout_week_min = 24
dropout_week_max = 28
[axis_a.A6]
name = "늦게 시작"
day_rate = [0.90, 0.90]
meal_prob = [0.80, 0.40, 0.20, 0.4]        # 부분 기록일의 끼니별 확률(아침·점심·저녁·간식)
start_week_min = 22
start_week_max = 26
[axis_a.A7]
name = "저녁 누락형"
day_rate = [0.90, 0.90]
meal_prob = [0.95, 0.90, 0.30, 0.3]
full_day_prob = 0.0
[axis_a.A8]
name = "간식·단일 끼니형"
