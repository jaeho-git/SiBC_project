# 페르소나 생성기 매개변수 v1 (docs/persona_data_spec_20261027.md §3~§6)
# source 표기: measured = release DB 집계(2026-10-27 조회, 식이 창 2026-09-01~10-26) 또는 문헌/외부 참조,
#              assumption = 관측 목표를 맞추기 위한 가정(측정값 아님). 모든 값은 합성 데이터용이며 실제 성능 근거가 아니다.

[meta]
version = "persona.2026.10.27-v1"
calibration_measured_at = "2026-10-27"
calibration_window_start = 2026-08-31   # 생성 기간의 마지막 8주(월요일 시작). 운영 집계 창 9/1~10/26과 같은 길이
calibration_window_end = 2026-10-25
user_id_prefix = "99999999-0000-4000-8000-"

[period]
start = 2026-03-30          # 월요일. 210일 = 30주 (명세 §8)
end = 2026-10-25            # 일요일
today = 2026-10-27
recompute_days = 35

[intake]
# 진짜 하루 섭취의 기준은 에너지 균형(기초대사량 × PAL)이다. 국민건강영양조사 기대값(manifest.expected_kcal)은 관측 분포 대조용으로만 남긴다.
day_cv = 0.25                                   # measured: 사용자 내 하루 열량 변동 계수 중앙값 0.247 (3끼 기록일, 96명); 문헌 23~25%
macro_share = { carb = 0.60, protein = 0.15, fat = 0.23 }   # measured: 하루 합계 에너지비 중앙값
sodium_mg_per_kcal = 2.4                        # measured: 중앙값 2.37
main_share = { BREAKFAST = 0.30, LUNCH = 0.38, DINNER = 0.32 }   # measured: 끼니 열량 중앙값 389/494/424
true_skip_prob = { BREAKFAST = 0.10, LUNCH = 0.05, DINNER = 0.03 }   # assumption: 관측 부재율(13/23/28%)은 결식+미기록 혼합
elderly_breakfast_skip_prob = 0.12              # assumption
skip_transfer = 0.6                             # assumption: 결식 끼니 열량의 60%만 다른 끼니로 이전
snack_prob = 0.5                                # assumption (관측 간식일 11%는 누락 포함)
snack_share = 0.12                              # assumption: 간식이 있는 날 하루 열량 중 간식 몫
snack_kcal_min = 40
snack_kcal_max = 220
late_night_rate = 0.11                          # measured: 21시 이후·00~04시 끼니 비율 11.1%
late_night_after_midnight = 0.15                # assumption: 야식 중 자정 이후 비율
late_log_rate = 0.22                            # assumption: 주요 끼니의 15%는 식후 2시간~23시 사이의 늦은 시각으로 기록됨(운영 점심·저녁 90백분위 20~21시에서 역산)
full_day_prob = 0.65                            # assumption: 기록일 중 "그날 끼니를 모두 기록"하는 날의 비율. 나머지 날은 끼니별 확률(meal_prob)로 일부만 기록
record_delay_within_30min = 0.70                # assumption
record_delay_same_day = 0.25                    # assumption (나머지 5%는 다음 날)

[intake.meal_hour]                              # measured: 중앙값 아침 8 / 점심 13 / 저녁 18시. [평균, 표준편차]
BREAKFAST = [8.0, 1.0]
LUNCH = [12.8, 1.0]
DINNER = [18.3, 1.2]
MORNING_SNACK = [10.3, 0.5]
AFTERNOON_SNACK = [15.5, 0.8]
LATE_NIGHT_SNACK = [22.2, 0.7]

[expenditure]
pal_elderly = 1.38          # FAO/WHO/UNU 2004 좌식 범주 하한 부근(고령·저활동); 운영 소모 중앙값 1,455 kcal에 맞춤
pal_adult = 1.55
pal_active = 1.80
pal_sd = 0.05
day_cv = 0.08               # measured: 사용자 내 소모 변동 계수 중앙값 0.105 (부분 착용일 변동과 합쳐 0.10 안팎이 되도록 0.08)
device_bias_range = 0.08    # assumption: 사용자별 고정 편향 ±8%
exercise_kcal_mean = 250    # assumption
exercise_end_hour = 18.5
exercise_days_per_week_default = 1
exercise_days_per_week_active = 4

[weight]
kcal_per_kg = 7700          # 정적 환산. 동적 모델(Hall 등)의 과대 예측 경고 때문에 감쇠를 둠
damping = 0.3               # assumption
max_daily_change_kg = 0.15
measure_noise_sd = 0.4      # measured: 사용자 내 체중 표준편차 중앙값 0.54 kg(추세 포함)

[wearable]
partial_n_records_min = 73      # measured: 심박 n_records 10백분위 73
partial_n_records_max = 479     # 완전성 규칙 초안 §2: 480 미만 = 부분 착용
full_n_records_min = 600
full_n_records_max = 1300       # measured: 90백분위 1,205
partial_burn_factor_min = 0.8   # assumption: 부분 착용일 소모 기록이 낮게 잡힘
partial_burn_factor_max = 0.95
device_scale = 0.87             # measured-derived: 운영 total_kcal_burned 중앙값 1,455는 기초대사량×PAL 추정보다 약 15% 낮음. 기기 총소모의 체계적 과소 추정으로 재현(§5.1 소모 타당성 평가 대상)
steps_median = 5785             # measured
steps_log_sd = 0.55             # measured 10~90백분위 1,246~14,162에서 역산
resting_hr_min = 60
resting_hr_max = 80
ios_share = 0.15                # assumption (운영 지연 분포 전체가 Android형에 가깝다)
weight_arrival_max_days = 1

[wearable.arrival.android]      # measured: calories 원천 수신 지연 (data_check §1.3)
median_days = 4.4
p90_days = 23.5
max_days = 30
[wearable.arrival.ios]          # assumption: 백그라운드 전송
median_days = 1.0
p90_days = 7.0
max_days = 30
[wearable.arrival.extreme]      # P24용
median_days = 20.0
p90_days = 29.0
max_days = 30

# 축 A 기록 패턴: day_rate(평일, 주말), meal_prob(아침·점심·저녁·간식), 특수 동작 (명세 §4)
