[project]
name = "sibc-dietary-analysis"
version = "0.1.0"
description = "SiBC dietary analysis: meal/day nutrient totals, guideline judgement, MFDS reference standardisation"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
ref = ["pandas>=2.2", "pyreadstat>=1.2", "numpy>=1.26"]  # 국민건강영양조사 SAS 원자료 처리용

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dietary_analysis"]
