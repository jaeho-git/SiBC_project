[project]
name = "sibc-checkup"
version = "0.1.0"
description = "SiBC wearable -> medical checkup prediction (joint training frame, guide v1.3)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "torch>=2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sibc_checkup"]
